<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure AI Foundry · Agent 对话</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                   Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- shared ---------- */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 28px; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 500; cursor: pointer; line-height: 1.3;
      transition: opacity .15s, box-shadow .15s, background .15s;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary  { background: #0078d4; color: #fff; }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 0 0 2px rgba(0,120,212,.3); }
    .btn-outline  { background: transparent; color: #555; border: 1px solid #ccc; }
    .btn-outline:hover:not(:disabled) { background: #f0f0f0; }
    .btn-danger   { background: #d32f2f; color: #fff; }

    .error-tip { color: #d32f2f; font-size: .85rem; margin-top: 14px; }
    .error-tip.hidden { display: none; }

    .hidden { display: none !important; }

    /* ---------- step indicator ---------- */
    .steps { display: flex; justify-content: center; gap: 8px; margin-bottom: 36px; }
    .step {
      display: flex; align-items: center; gap: 6px;
      font-size: .78rem; color: #aaa;
    }
    .step .num {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 600;
      background: #eee; color: #aaa;
      flex-shrink: 0;
    }
    .step.active { color: #0078d4; }
    .step.active .num { background: #0078d4; color: #fff; }
    .step.done { color: #2e7d32; }
    .step.done .num { background: #2e7d32; color: #fff; }
    .step-arrow { color: #ccc; font-size: .8rem; align-self: center; }

    /* ---------- login screen ---------- */
    #loginScreen {
      display: flex; flex-direction: column; align-items: center; gap: 24px;
      animation: fadeIn .35s ease;
    }
    #loginScreen.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .login-card h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 6px; }
    .login-card .sub { color: #666; font-size: .88rem; margin-bottom: 30px; line-height: 1.5; }

    /* ---------- redirecting overlay ---------- */
    #redirectingOverlay {
      position: fixed; inset: 0;
      background: rgba(255,255,255,.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      z-index: 1000;
      animation: fadeIn .25s ease;
    }
    #redirectingOverlay.hidden { display: none; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #0078d4;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- toast ---------- */
    #successToast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      background: #2e7d32; color: #fff; padding: 12px 28px;
      border-radius: 8px; font-size: .9rem; font-weight: 500;
      box-shadow: 0 4px 16px rgba(46,125,50,.3); z-index: 999;
      animation: slideDown .35s ease, fadeOut .4s 1.5s ease forwards;
    }
    #successToast.hidden { display: none; }
    @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(-50%) translateY(-16px); } }

    /* ---------- chat shell ---------- */
    #chatScreen {
      display: flex; flex-direction: column;
      height: 100vh; width: 100vw; max-width: 800px;
    }
    #chatScreen.hidden { display: none; }

    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; background: #fff; border-bottom: 1px solid #e0e0e0;
    }
    .chat-header h1 { font-size: 1rem; font-weight: 600; }
    .chat-header .user-badge {
      font-size: .8rem; color: #666;
      max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-header .header-actions { display: flex; gap: 8px; align-items: center; }

    /* ---------- messages ---------- */
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      background: #f5f5f5;
    }

    .msg { display: flex; gap: 10px; max-width: 85%; }
    .msg.user    { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .msg .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 600; flex-shrink: 0;
    }
    .msg.user .avatar      { background: #0078d4; color: #fff; }
    .msg.assistant .avatar { background: #e0e0e0; color: #555; }

    .msg .bubble {
      padding: 10px 14px; border-radius: 14px;
      font-size: .9rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble      { background: #0078d4; color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant .bubble { background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

    .msg .bubble .loading-dots { display: inline-flex; gap: 3px; }
    .msg .bubble .loading-dots span {
      width: 7px; height: 7px; background: #888; border-radius: 50%;
      animation: dot-pulse 1.2s infinite ease-in-out;
    }
    .msg .bubble .loading-dots span:nth-child(2) { animation-delay: .2s; }
    .msg .bubble .loading-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot-pulse {
      0%, 80%, 100% { opacity: .4; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* ---------- input ---------- */
    .chat-input {
      display: flex; gap: 8px; padding: 14px 20px;
      background: #fff; border-top: 1px solid #e0e0e0;
    }
    .chat-input textarea {
      flex: 1; resize: none; border: 1px solid #ddd; border-radius: 8px;
      padding: 10px 12px; font-size: .9rem; font-family: inherit;
      outline: none; transition: border-color .15s;
      min-height: 44px; max-height: 120px; line-height: 1.4;
    }
    .chat-input textarea:focus { border-color: #0078d4; }
    .chat-input button { align-self: flex-end; padding: 10px 20px; white-space: nowrap; }

    /* ---------- scrollbar ---------- */
    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>

  <!-- ====== Login Screen ====== -->
  <div id="loginScreen">
    <div class="card login-card">
      <!-- Step indicator -->
      <div class="steps">
        <div class="step active" id="step1"><span class="num">1</span> 授权</div>
        <span class="step-arrow">→</span>
        <div class="step" id="step2"><span class="num">2</span> 登录</div>
        <span class="step-arrow">→</span>
        <div class="step" id="step3"><span class="num">3</span> 对话</div>
      </div>

      <h1>Azure AI Foundry</h1>
      <p class="sub">通过 Microsoft OAuth 登录后，即可与 AI Foundry Agent 对话。</p>

      <button type="button" id="authBtn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 21 21" fill="none">
          <rect x="1" y="1" width="8" height="8" fill="#f25022"/>
          <rect x="12" y="1" width="8" height="8" fill="#7fba00"/>
          <rect x="1" y="12" width="8" height="8" fill="#00a4ef"/>
          <rect x="12" y="12" width="8" height="8" fill="#ffb900"/>
        </svg>
        使用 Microsoft 账号登录
      </button>

      <p class="desc" style="margin-top: 24px; color: #888; font-size: .78rem; line-height: 1.6; text-align: left;">
        <strong style="color: #555;">授权流程说明：</strong><br>
        1. 点击上方按钮后，将跳转至 Microsoft 登录页面。<br>
        2. 使用你的 Microsoft 账号（工作/学校/个人）完成登录并同意授权。<br>
        3. 授权成功后自动跳转回本应用，进入对话界面。
      </p>

      <p id="authError" class="error-tip hidden"></p>
    </div>
  </div>

  <!-- ====== Redirecting Overlay ====== -->
  <div id="redirectingOverlay" class="hidden">
    <div class="spinner"></div>
    <p style="font-size: .95rem; color: #333; font-weight: 500;">正在跳转到 Microsoft 登录页面…</p>
    <p style="font-size: .8rem; color: #888;">登录完成后将自动返回此页面</p>
  </div>

  <!-- ====== Success Toast ====== -->
  <div id="successToast" class="hidden">登录成功！</div>

  <!-- ====== Chat Screen ====== -->
  <div id="chatScreen" class="hidden">
    <div class="chat-header">
      <div>
        <h1>AI Foundry Agent</h1>
        <div id="userBadge" class="user-badge"></div>
      </div>
      <div class="header-actions">
        <button type="button" id="diagBtn" class="btn btn-outline" style="font-size:.8rem">检查 Agent</button>
        <button type="button" id="logoutBtn" class="btn btn-outline">退出登录</button>
      </div>
    </div>

    <div id="messageList" class="chat-messages">
      <!-- rendered by JS -->
    </div>

    <div class="chat-input">
      <textarea id="messageInput" placeholder="输入你的问题…" rows="1" autocomplete="off"></textarea>
      <button type="button" id="sendBtn" class="btn btn-primary" disabled>发送</button>
    </div>
  </div>

  <script>
    // ----------------------------------------------------------------
    //  State
    // ----------------------------------------------------------------
    let loggedIn = false;
    let sending = false;
    const messages = [];

    // ----------------------------------------------------------------
    //  DOM refs
    // ----------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const loginScreen      = $("loginScreen");
    const chatScreen       = $("chatScreen");
    const redirectOverlay  = $("redirectingOverlay");
    const successToast     = $("successToast");
    const authBtn          = $("authBtn");
    const authError        = $("authError");
    const logoutBtn        = $("logoutBtn");
    const messageList      = $("messageList");
    const messageInput     = $("messageInput");
    const sendBtn          = $("sendBtn");
    const userBadge        = $("userBadge");
    const step1            = $("step1");
    const step2            = $("step2");
    const step3            = $("step3");
    const authErrorMsg     = $("authError");

    // ----------------------------------------------------------------
    //  Helpers
    // ----------------------------------------------------------------
    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function autoResize(textarea) {
      textarea.style.height = "auto";
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
    }

    function scrollToBottom() {
      messageList.scrollTop = messageList.scrollHeight;
    }

    // ----------------------------------------------------------------
    //  Render messages
    // ----------------------------------------------------------------
    function renderMessages() {
      messageList.innerHTML = messages.map((m) => {
        const isUser = m.role === "user";
        const avatar = isUser ? "U" : "AI";
        const content = m.loading
          ? '<span class="loading-dots"><span></span><span></span><span></span></span>'
          : escapeHtml(m.content);
        return `<div class="msg ${isUser ? "user" : "assistant"}">
          <div class="avatar">${avatar}</div>
          <div class="bubble">${content}</div>
        </div>`;
      }).join("");
      scrollToBottom();
    }

    function addMessage(role, content) {
      messages.push({ role, content, loading: false });
      renderMessages();
    }

    function updateLastMessage(content) {
      if (messages.length > 0) {
        messages[messages.length - 1].content = content;
        messages[messages.length - 1].loading = false;
        renderMessages();
      }
    }

    function setLastLoading() {
      if (messages.length > 0) {
        messages[messages.length - 1].loading = true;
        renderMessages();
      }
    }

    // ----------------------------------------------------------------
    //  Auth UI
    // ----------------------------------------------------------------
    function updateSteps(active) {
      [step1, step2, step3].forEach((el, i) => {
        el.classList.remove("active", "done");
        if (i + 1 < active) el.classList.add("done");
        else if (i + 1 === active) el.classList.add("active");
      });
    }

    async function checkAuthStatus() {
      try {
        const res = await fetch("/auth/status", { credentials: "include" });
        const body = await res.json();
        if (body.code === 200 && body.data.logged_in) {
          loggedIn = true;
          const user = body.data.user || {};
          const name = user.name || user.email || "已登录";
          userBadge.textContent = name;
          showSuccessAndChat();
          return;
        }
      } catch (_) { /* offline or sandbox - show login */ }
      showLoginUI();
    }

    function showLoginUI() {
      updateSteps(1);
      loginScreen.classList.remove("hidden");
      chatScreen.classList.add("hidden");
      redirectOverlay.classList.add("hidden");
    }

    function showSuccessAndChat() {
      // Show success toast briefly
      successToast.classList.remove("hidden");
      setTimeout(() => successToast.classList.add("hidden"), 2000);

      updateSteps(3);
      loginScreen.classList.add("hidden");
      chatScreen.classList.remove("hidden");

      if (messages.length === 0) {
        addMessage("assistant", "你好！OAuth 授权已完成。请问有什么问题？");
      }
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();
    }

    // ----------------------------------------------------------------
    //  Login flow
    // ----------------------------------------------------------------
    authBtn.addEventListener("click", function () {
      if (this.disabled) return;
      updateSteps(2);
      redirectOverlay.classList.remove("hidden");
      authError.classList.add("hidden");
      window.location.href = "/auth/login";
    });

    // ----------------------------------------------------------------
    //  Logout
    // ----------------------------------------------------------------
    logoutBtn.addEventListener("click", async function () {
      try {
        await fetch("/auth/logout", { method: "POST", credentials: "include" });
      } catch (_) {}
      loggedIn = false;
      messages.length = 0;
      redirectOverlay.classList.add("hidden");
      successToast.classList.add("hidden");
      showLoginUI();
    });

    // ----------------------------------------------------------------
    //  Diagnostics
    // ----------------------------------------------------------------
    const diagBtn = document.getElementById("diagBtn");
    diagBtn.addEventListener("click", async function () {
      if (!loggedIn) return;
      this.disabled = true;
      this.textContent = "检查中…";
      addMessage("assistant", "正在检查 Agent 配置和连接状态…");

      try {
        const res = await fetch("/api/agent/check", {
          credentials: "include",
        });
        const body = await res.json();

        let diagHtml = "**Agent 诊断结果**\n\n";
        if (body.code === 200) {
          diagHtml += "✅ Agent 连接正常\n";
          diagHtml += "  - Agent: " + (body.data.agent_info.name || "(unknown)") + "\n";
          diagHtml += "  - 版本: " + (body.data.agent_info.version || "N/A") + "\n";
          diagHtml += "  - 状态: " + (body.data.agent_info.status || "N/A") + "\n";
          diagHtml += "  - 端点: " + body.data.endpoint + "\n";
          diagHtml += "  - Agent名称: " + (body.data.agent_name || "N/A") + "\n";
          diagHtml += "  - Agent版本: " + (body.data.agent_version || "latest");
        } else {
          diagHtml += "❌ Agent 连接失败\n";
          diagHtml += "  - 错误类型: " + (body.data.error_type || "N/A") + "\n";
          diagHtml += "  - 错误详情: " + (body.data.error_detail || body.msg || "未知错误") + "\n";
          diagHtml += "  - 端点: " + (body.data.endpoint || "N/A") + "\n";
          diagHtml += "  - Agent名称: " + (body.data.agent_name || "N/A") + "\n";
          diagHtml += "  - Agent版本: " + (body.data.agent_version || "latest");
        }
        updateLastMessage(diagHtml);
      } catch (err) {
        updateLastMessage("诊断失败：" + err.message);
      } finally {
        this.disabled = false;
        this.textContent = "检查 Agent";
      }
    });

    // ----------------------------------------------------------------
    //  Send message
    // ----------------------------------------------------------------
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || sending || !loggedIn) return;

      sending = true;
      sendBtn.disabled = true;
      messageInput.disabled = true;

      addMessage("user", text);
      addMessage("assistant", "");
      setLastLoading();
      messageInput.value = "";
      autoResize(messageInput);

      try {
        const res = await fetch("/api/ai/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ messages: [{ role: "user", content: text }] }),
        });

        const body = await res.json();

        if (res.status === 401) {
          updateLastMessage("登录已过期，请重新登录。");
          setTimeout(() => checkAuthStatus(), 1500);
          return;
        }

        if (body.code === 200) {
          updateLastMessage(body.data || "(空回复)");
        } else {
          updateLastMessage("错误：" + (body.msg || "未知错误"));
        }
      } catch (err) {
        updateLastMessage("网络错误：" + err.message);
      } finally {
        sending = false;
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    messageInput.addEventListener("input", function () {
      autoResize(this);
    });

    // ----------------------------------------------------------------
    //  Init
    // ----------------------------------------------------------------
    // Check for error in URL (from callback)
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get("error");
    if (error) {
      authErrorMsg.textContent = "授权失败：" + decodeURIComponent(error);
      authErrorMsg.classList.remove("hidden");
      window.history.replaceState({}, document.title, "/");
    }

    checkAuthStatus();
  </script>
</body>
</html>
