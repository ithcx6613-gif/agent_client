<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Azure AI Foundry · OAuth 与 Agent</title>
    <style>
        .container { max-width: 800px; margin: 50px auto; padding: 20px; }
        .section { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid #eee; }
        .section:last-of-type { border-bottom: none; }
        .section h2 { font-size: 1.15rem; margin: 0 0 8px 0; }
        .steps { color: #555; font-size: 0.9rem; margin: 0 0 14px 0; line-height: 1.5; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .btn { padding: 10px 20px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:disabled { background: #cccccc; cursor: not-allowed; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover:not(:disabled) { background: #5a6268; }
        #chatResult { margin-top: 20px; padding: 12px; border: 1px solid #eee; min-height: 100px; white-space: pre-wrap; word-break: break-word; font-family: system-ui, sans-serif; font-size: 14px; }
        .hidden { display: none; }
        .error-tip { color: #dc3545; margin-top: 10px; }
        .status-line { color: #198754; font-size: 0.88rem; margin-top: 10px; }
        .status-line.warn { color: #856404; }
        .status-line.expired { color: #dc3545; }
        #messageInput { flex: 1; min-width: 200px; padding: 10px; box-sizing: border-box; }
        .chat-input-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
        .chat-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .chat-header h2 { margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 1.35rem; font-weight: 600; margin-bottom: 24px;">OAuth 登录与 Agent 对话</h1>

        <!-- ① OAuth -->
        <div id="authSection" class="section">
            <h2>① OAuth 登录</h2>
            <p class="steps">点击下方按钮将跳转到 Azure 登录页；授权成功后浏览器会回到本站，并自动保存访问令牌（需与本站<strong>同源</strong>打开页面，以便携带 Session Cookie）。</p>
            <div class="btn-row">
                <button type="button" id="authBtn" class="btn">跳转到 Azure 授权</button>
            </div>
            <p id="authTip" style="color: #666; margin-top: 10px; font-size: 0.9rem;">若曾登录过，可直接进入下方 Agent 区域；令牌失效时请重新授权。</p>
            <p id="authError" class="error-tip hidden"></p>
        </div>

        <!-- ② Agent -->
        <div id="chatSection" class="section hidden">
            <div class="chat-header">
                <div>
                    <h2>② 调用 Agent</h2>
                    <p class="steps" style="margin-bottom: 0;">输入问题后发送，请求将携带 Bearer Token 调用后端 <code>/api/ai/chat</code>。</p>
                </div>
                <button type="button" id="reloginBtn" class="btn btn-secondary">清除登录并重新授权</button>
            </div>
            <p id="authStatusLine" class="status-line" aria-live="polite"></p>
            <div class="chat-input-row">
                <input type="text" id="messageInput" placeholder="输入你的问题后按 Enter 或点发送" autocomplete="off">
                <button type="button" id="sendBtn" class="btn">发送</button>
            </div>
            <div id="chatResult"></div>
        </div>
    </div>

    <script>
        // 默认与当前页面同源（推荐：与 Flask 同域，Session 才能生效）。
        // 若前端与 API 分离部署，可改为例如 "http://localhost:5000"（需配置 CORS 与 Cookie 域）。
        const BACKEND_BASE_URL = "";

        const LS_TOKEN = "azure_access_token";
        const LS_EXPIRES = "azure_token_expires_at";
        const LS_TOKEN_TYPE = "azure_token_type";

        let accessToken = "";

        function apiUrl(path) {
            const p = path.startsWith("/") ? path : "/" + path;
            const base = String(BACKEND_BASE_URL || "").replace(/\/$/, "");
            return base ? base + p : p;
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function formatAiReply(data) {
            if (data === null || data === undefined) return "AI 回复为空";
            if (typeof data === "string") return escapeHtml(data);
            return escapeHtml(JSON.stringify(data, null, 2));
        }

        function persistTokenMeta(expiresInStr, tokenType) {
            if (expiresInStr != null && expiresInStr !== "") {
                const sec = parseInt(expiresInStr, 10);
                if (!isNaN(sec) && sec > 0) {
                    localStorage.setItem(LS_EXPIRES, String(Date.now() + sec * 1000));
                }
            }
            if (tokenType) {
                localStorage.setItem(LS_TOKEN_TYPE, tokenType);
            }
        }

        function updateAuthStatusDisplay() {
            const el = document.getElementById("authStatusLine");
            if (!el) return;
            const expMs = localStorage.getItem(LS_EXPIRES);
            const ttype = localStorage.getItem(LS_TOKEN_TYPE);
            if (!accessToken) {
                el.textContent = "";
                el.className = "status-line";
                return;
            }
            let line = "已登录";
            if (ttype) line += " · 类型 " + ttype;
            if (expMs) {
                const t = parseInt(expMs, 10);
                if (!isNaN(t)) {
                    const d = new Date(t);
                    line += " · 约 " + d.toLocaleString("zh-CN") + " 过期";
                    el.className = "status-line" + (Date.now() > t ? " expired" : "");
                    if (Date.now() > t) line += "（已过期，请重新授权）";
                }
            } else {
                el.className = "status-line warn";
                line += " · 未记录过期时间（刷新后若失败请重新授权）";
            }
            el.textContent = line;
        }

        function switchToChatSection() {
            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("chatSection").classList.remove("hidden");
            updateAuthStatusDisplay();
        }

        function switchToAuthSection() {
            document.getElementById("authSection").classList.remove("hidden");
            document.getElementById("chatSection").classList.add("hidden");
        }

        function clearLoginState() {
            accessToken = "";
            localStorage.removeItem(LS_TOKEN);
            localStorage.removeItem(LS_EXPIRES);
            localStorage.removeItem(LS_TOKEN_TYPE);
        }

        function handleUnauthorized(message) {
            clearLoginState();
            switchToAuthSection();
            const authError = document.getElementById("authError");
            authError.textContent = message || "登录已失效，请重新授权";
            authError.classList.remove("hidden");
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const authError = document.getElementById("authError");

            const error = urlParams.get("error");
            if (error) {
                authError.textContent = "授权失败：" + decodeURIComponent(error);
                authError.classList.remove("hidden");
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            const token = urlParams.get("access_token");
            if (token) {
                accessToken = token;
                localStorage.setItem(LS_TOKEN, token);
                const expiresIn = urlParams.get("expires_in");
                const tokenType = urlParams.get("token_type");
                persistTokenMeta(expiresIn, tokenType);
                switchToChatSection();
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            const storedToken = localStorage.getItem(LS_TOKEN);
            if (storedToken) {
                accessToken = storedToken;
                switchToChatSection();
            }
        };

        const authBtn = document.getElementById("authBtn");
        const defaultAuthLabel = authBtn.textContent;

        authBtn.addEventListener("click", async function() {
            const authError = document.getElementById("authError");
            if (authBtn.disabled) return;
            authBtn.disabled = true;
            authBtn.textContent = "正在获取授权地址…";
            authError.classList.add("hidden");

            try {
                const response = await fetch(apiUrl("/auth/url"), {
                    method: "GET",
                    credentials: "include"
                });

                if (!response.ok) throw new Error("HTTP " + response.status);
                const result = await response.json();

                if (result.code === 200 && result.data && result.data.auth_url) {
                    window.location.href = result.data.auth_url;
                    return;
                }
                authError.textContent = "获取授权 URL 失败：" + (result.msg || "未知错误");
                authError.classList.remove("hidden");
            } catch (err) {
                authError.textContent = "网络错误：" + err.message;
                authError.classList.remove("hidden");
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = defaultAuthLabel;
            }
        });

        document.getElementById("reloginBtn").addEventListener("click", function() {
            clearLoginState();
            switchToAuthSection();
            document.getElementById("authError").classList.add("hidden");
            document.getElementById("chatResult").innerHTML = "";
        });

        async function sendChatMessage() {
            const messageInput = document.getElementById("messageInput");
            const message = messageInput.value.trim();
            const chatResult = document.getElementById("chatResult");
            const sendBtn = document.getElementById("sendBtn");

            if (!message) {
                alert("请输入问题后再发送");
                return;
            }
            if (!accessToken) {
                alert("未获取到 Token，请先完成 OAuth 登录");
                switchToAuthSection();
                return;
            }

            chatResult.textContent = "AI 正在思考中…";
            sendBtn.disabled = true;

            try {
                const response = await fetch(apiUrl("/api/ai/chat"), {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + accessToken
                    },
                    body: JSON.stringify({
                        messages: [{ role: "user", content: message }],
                        temperature: 0.7
                    })
                });

                let result = null;
                try {
                    result = await response.json();
                } catch (_) {
                    result = null;
                }

                if (response.status === 401) {
                    handleUnauthorized(result && result.msg ? result.msg : "未提供有效 Token（401）");
                    return;
                }
                if (response.status === 403) {
                    const msg = (result && result.msg) ? result.msg : "需要管理员同意或权限不足（403）";
                    chatResult.innerHTML = "<span style=\"color:#dc3545;\">" + escapeHtml(msg) + "</span>";
                    return;
                }

                if (!response.ok) {
                    const msg = result && result.msg ? result.msg : ("HTTP " + response.status);
                    chatResult.innerHTML = "<span style=\"color:#dc3545;\">" + escapeHtml(msg) + "</span>";
                    return;
                }

                if (result && result.code === 200) {
                    chatResult.innerHTML = "<strong>AI 回复</strong><br>" + formatAiReply(result.data);
                } else if (result) {
                    chatResult.innerHTML = "<span style=\"color:#dc3545;\">调用失败：" + escapeHtml(result.msg || "") + "</span>";
                } else {
                    chatResult.textContent = "无法解析响应";
                }
            } catch (err) {
                chatResult.innerHTML = "<span style=\"color:#dc3545;\">网络/接口错误：" + escapeHtml(err.message) + "</span>";
            } finally {
                sendBtn.disabled = false;
                messageInput.value = "";
            }
        }

        document.getElementById("sendBtn").addEventListener("click", sendChatMessage);

        document.getElementById("messageInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });
    </script>
</body>
</html>
